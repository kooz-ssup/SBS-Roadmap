<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교육과정 로드맵 &amp; 수업일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Gothic+A1:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2edf1; --paper:#ffffff; --ink:#27222c; --muted:#7c7383; --line:#e7dee5; --field:#faf6f9;
  --rose:#e43a55; --rose-d:#b81f3c; --blush:#f8d3da; --sel:#fff0f3; --navy:#2d2b63; --navy-ink:#ffffff;
  --bar-bg:rgba(255,255,255,.88); --shadow:0 1px 2px rgba(60,20,40,.06),0 8px 24px rgba(60,20,40,.06);
  --cell-on:#ffe9ee;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151216; --paper:#211c24; --ink:#f2edf3; --muted:#a99fb0; --line:#3a323f; --field:#2a242e;
    --rose:#ff5a74; --rose-d:#ff8fa2; --blush:#5a2633; --sel:#3a1d27; --navy:#4b48a8;
    --bar-bg:rgba(33,28,36,.88); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --cell-on:#43222c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151216; --paper:#211c24; --ink:#f2edf3; --muted:#a99fb0; --line:#3a323f; --field:#2a242e;
  --rose:#ff5a74; --rose-d:#ff8fa2; --blush:#5a2633; --sel:#3a1d27; --navy:#4b48a8;
  --bar-bg:rgba(33,28,36,.88); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --cell-on:#43222c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar-bg);backdrop-filter:blur(8px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
img{max-width:100%}

/* ── 상단 바 ── */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 16px}
.nav{display:flex;gap:6px}
.btn{height:34px;padding:0 12px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.rose{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.danger{color:var(--rose-d);border-color:var(--blush)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.ctx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1}
.spacer{flex:1}
.stu{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.stu select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 8px;max-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;height:32px;padding:0 12px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.save.err{color:var(--rose-d);font-weight:700}
.authbox{display:inline-flex;align-items:center;gap:6px}
.who{font-size:12px;font-weight:700;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{max-width:1320px;margin:12px auto 0;padding:0 16px}
.hint p{margin:0;padding:9px 14px;border-radius:10px;background:var(--sel);border:1px solid var(--blush);color:var(--rose-d);font-weight:600;font-size:13px}
.hint.edit p{background:color-mix(in srgb,var(--navy) 10%,var(--paper));border-color:color-mix(in srgb,var(--navy) 30%,var(--paper));color:var(--ink)}

main{max-width:1320px;margin:0 auto;padding:14px 16px 60px}
.sheet{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}

/* ── 로드맵 ── */
.rm-head{position:relative;color:#fff;padding:22px 28px;display:flex;align-items:center;gap:18px 26px;flex-wrap:wrap;
  background:
   radial-gradient(70% 160% at 4% 30%,rgba(255,138,160,.95) 0%,transparent 60%),
   radial-gradient(45% 140% at 42% -10%,rgba(255,184,120,.85) 0%,transparent 60%),
   radial-gradient(55% 170% at 98% 70%,rgba(160,48,140,.9) 0%,transparent 62%),
   radial-gradient(40% 120% at 70% 120%,rgba(232,60,110,.9) 0%,transparent 60%),
   linear-gradient(100deg,#ea4b6c,#f2745f 45%,#c9437f)}
.rm-head h1{margin:0;font-family:"Archivo Black","Arial Black",Impact,sans-serif;font-weight:400;font-size:clamp(26px,4.6vw,58px);line-height:1;letter-spacing:.005em;text-shadow:0 2px 0 rgba(90,10,40,.12)}
.rm-head .tags span{display:block;width:fit-content;background:#2d2b63;color:#fff;padding:3px 11px;margin:3px 0;font-weight:700;font-size:15px}
.rm-head input{background:rgba(255,255,255,.18);border:1px dashed rgba(255,255,255,.7);border-radius:6px;color:#fff;padding:4px 8px}
.rm-head input.t{font-family:"Archivo Black","Arial Black",sans-serif;font-size:clamp(22px,3.6vw,44px);width:min(640px,100%)}
.rm-head .tags input{display:block;margin:3px 0;font-weight:700;width:240px;background:#2d2b63}

.rm-body{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;padding:10px 24px 18px}
.course{grid-column:1/-1;display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:start;padding:12px 0 10px;border-bottom:1px dashed var(--line)}
.course.half{grid-column:auto;grid-template-columns:86px 1fr;gap:8px}
.course.half .subj{min-width:max(48px,min-content)}
.clabel{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border-radius:12px;padding:4px 2px;position:relative}
.clabel[role="button"]{cursor:pointer}
.clabel[role="button"]:hover .cicon{border-color:var(--rose)}
.cicon{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:25px;border:2px solid var(--line);background:var(--paper);box-shadow:inset 0 0 0 4px var(--field);transition:border-color .15s,box-shadow .15s}
.cname{font-weight:800;font-size:13px;line-height:1.25;word-break:keep-all;padding:2px 8px;border-radius:999px;transition:background .15s,color .15s}
.cname small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.course.has .cicon{border-color:var(--rose);box-shadow:inset 0 0 0 4px var(--sel),0 0 0 4px var(--blush)}
.course.has .cname{background:var(--rose);color:#fff}
.course.has .cname small{color:rgba(255,255,255,.85)}
.cctrl{display:flex;gap:3px;margin-top:2px}
.cctrl button{width:26px;height:24px;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-size:12px;padding:0}

.track{display:flex;flex-wrap:wrap;align-items:stretch;row-gap:12px;padding-top:4px;min-width:0}
.brk{flex-basis:100%;height:0}
.indent{width:26px;flex:none;position:relative}
.indent::before{content:"";position:absolute;left:10px;top:-12px;width:12px;height:22px;border-left:2px solid var(--blush);border-bottom:2px solid var(--blush);border-bottom-left-radius:8px}
.subj{flex:1 1 0;min-width:max(52px,min-content);max-width:136px;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:17px 4px 7px;background:none;border:2px solid transparent;border-radius:10px;text-align:center;color:var(--ink);transition:background .15s,border-color .15s,opacity .15s}
.subj .bar{position:absolute;left:-2px;right:-2px;top:3px;height:7px;background:var(--bar)}
.subj .bar::after{content:"";position:absolute;right:7px;top:1px;border-left:5px solid rgba(255,255,255,.95);border-top:2.5px solid transparent;border-bottom:2.5px solid transparent}
.track > .subj:first-child .bar{border-radius:4px 0 0 4px}
.track > .subj:last-child .bar{border-radius:0 4px 4px 0}
.subj .nm{font-weight:700;font-size:12px;line-height:1.25;white-space:pre-line;word-break:keep-all}
.subj .lv{font-size:11.5px;line-height:1.25;white-space:pre-line;word-break:keep-all}
.subj .nt{font-size:9.5px;line-height:1.2;color:var(--muted);word-break:keep-all}
.subj .ck{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--rose);color:#fff;font-size:12px;font-weight:800;display:none;place-items:center;box-shadow:0 0 0 2px var(--paper)}
.subj:hover{background:var(--field)}
.subj.sel{background:var(--sel);border-color:var(--rose)}
.subj.sel .nm{color:var(--rose-d)}
.subj.sel .ck{display:grid}
.subj.add{color:var(--muted);border:2px dashed var(--line);justify-content:center}
.subj.add .bar{display:none}
.rm.focus .course:not(.has){opacity:.4}
.rm.focus .subj:not(.sel){opacity:.42}
.rm.mode-check .subj{cursor:copy}
.add-course{grid-column:1/-1;margin-top:12px}
.rm-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 24px 16px;font-size:12px;color:var(--muted);align-items:center}

/* ── 수업일정 ── */
.sc{padding:0 0 18px}
.sc-head{background:#8eaadf;color:#1d2340;text-align:center;padding:10px 16px 8px}
.sc-head .ttl{font-size:21px;font-weight:800;display:flex;justify-content:center;align-items:baseline;gap:4px;flex-wrap:wrap}
.sc-head .ttl input{font-weight:800;text-align:right;width:9em}
.sc-head .note input{width:100%;text-align:center;font-size:13px}
.sc input{background:transparent;border:1px solid transparent;border-radius:5px;padding:2px 4px;min-width:0}
.sc input:hover{border-color:var(--line);background:var(--field)}
.sc input:focus{border-color:var(--rose);background:var(--paper);outline:none}
.sc-head input:hover,.sc-head input:focus{background:rgba(255,255,255,.55);color:#1d2340}
.sc-head input::placeholder{color:#4a5684}
.tbl-wrap{overflow-x:auto;padding:0 16px}
table.tt{border-collapse:collapse;width:100%;min-width:960px;font-size:12.5px;margin-top:0}
.tt th,.tt td{border:1px solid #c9c3cc;padding:0;height:24px;text-align:center}
.tt thead th{font-weight:800;background:var(--paper)}
.tt input{width:100%;text-align:center;height:22px;border-radius:0;font-weight:inherit}
.tt th.time{width:118px;font-weight:800}
.tt th.grp{width:44px;font-weight:800}
.tt th.grp input{writing-mode:horizontal-tb}
.tt td.on{background:var(--cell-on)}
.tt td input{font-size:11.5px;padding:2px 1px}
.tt td.on input{font-weight:700;color:var(--rose-d)}
.tt tr.gstart > *{border-top:2px solid #8f8794}
.tt .x,.blk .x{border:0;background:var(--blush);color:var(--rose-d);width:18px;height:18px;border-radius:50%;font-size:12px;line-height:18px;padding:0;font-weight:800}
.tt th .cellx{display:flex;align-items:center;gap:2px;padding-right:3px}
.addrow td{border:0;text-align:left;padding:4px 0}
.acad-title{text-align:center;margin:22px 16px 10px;padding:8px;border-top:2px solid #8f8794;border-bottom:2px solid #8f8794}
.acad-title input{font-size:19px;font-weight:800;text-align:center;width:min(520px,100%)}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px;padding:0 16px}
.blk{position:relative}
.blk table{border-collapse:collapse;width:100%;font-size:12.5px}
.blk th,.blk td{border:1px solid #c9c3cc;height:24px;text-align:center;padding:0}
.blk th{background:#bfd6ee;font-weight:800;color:#1d2340}
.blk th.bm{width:22%}
.blk th input{font-weight:800;text-align:center;width:100%;color:#1d2340}
.blk td input{width:100%;text-align:center}
.blk td.wd{width:12%;font-weight:700}
.blk input.memo{text-align:left;font-size:12px}
.blk .x{position:absolute;top:-7px;right:-7px}
.wd.warn{color:var(--rose-d)}

/* ── 과목 상세 ── */
.sp-head{padding:22px 26px 0;border-bottom:1px solid var(--line);position:relative}
.sp-head .crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.sp-head .crumb b{color:var(--ink)}
.sp-head h2{margin:6px 0 2px;font-size:28px;line-height:1.2;font-weight:800;white-space:pre-line}
.sp-head h2 .lv{font-size:18px;color:var(--rose-d);margin-left:8px;font-weight:700}
.sp-head .nt{margin:0;color:var(--muted);font-size:13px}
.sp-head .ribbon{position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--blush),var(--rose))}
.tabs{display:flex;gap:4px;margin-top:16px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:800;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--rose)}
.sp-body{padding:20px 26px 26px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}
.empty .btns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
table.days{border-collapse:collapse;width:100%;font-size:14px}
.days th{background:var(--field);font-weight:800;text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.days td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:pre-line}
.days td.no{width:64px;font-weight:800;color:var(--rose-d);white-space:nowrap}
.days td.ttl{width:26%;font-weight:700}
.days td.nb{width:16%;color:var(--muted);font-size:13px}
.days td.op{width:92px;white-space:nowrap}
.days input,.days textarea,.sum textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--field);padding:6px 8px;resize:vertical}
.days textarea{min-height:58px}
.days .op button{width:26px;height:26px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:0;font-size:12px}
.row-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sum{display:grid;gap:16px}
.sum section{border-left:4px solid var(--rose);padding:2px 0 2px 14px}
.sum h3{margin:0 0 4px;font-size:14px;font-weight:800;color:var(--rose-d)}
.sum p{margin:0;white-space:pre-line;max-width:80ch}
.sum textarea{min-height:80px}
.pager{display:flex;justify-content:space-between;gap:10px;padding:0 26px 22px}
.pager .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis}

/* ── 모달·토스트 ── */
.modal-bg{position:fixed;inset:0;background:rgba(20,10,20,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--paper);border-radius:14px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0;padding:16px 18px 6px;font-size:17px}
.modal .mb{padding:6px 18px 4px;display:grid;gap:12px}
.modal label{display:grid;gap:4px;font-size:13px;font-weight:700}
.modal label.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.modal input[type=text],.modal input[type=number],.modal textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field);width:100%}
.modal .help{font-size:12px;color:var(--muted);font-weight:400}
.modal .ma{display:flex;gap:8px;padding:14px 18px 16px;flex-wrap:wrap}
.modal .ma .left{margin-right:auto}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.emojis button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:18px;padding:0}
.modal p.msg{margin:0;white-space:pre-line}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;z-index:60;max-width:90vw}
.loading{padding:60px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .rm-body{grid-template-columns:1fr;padding:8px 12px 14px}
  .course.half{grid-column:1/-1}
  .course{grid-template-columns:72px 1fr;gap:8px}
  .cicon{width:44px;height:44px;font-size:20px}
  .cname{font-size:12px;padding:2px 6px}
  .blocks{grid-template-columns:1fr}
  .rm-head{padding:18px}
  .sp-head,.sp-body{padding-left:16px;padding-right:16px}
  .days td.op{width:auto}
  .topbar{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── 출력 ── */
@page{size:A4 landscape;margin:8mm}
@media print{
  :root,:root[data-theme="dark"]{
    --bg:#fff;--paper:#fff;--ink:#222;--muted:#6f6676;--line:#ddd3da;--field:#fff;--sel:#fff0f3;--blush:#f8d3da;--rose:#e43a55;--rose-d:#b81f3c;--navy:#2d2b63;--cell-on:#ffe9ee;color-scheme:light;
    padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  body::before,.topbar,.hint,.no-print,.cctrl,.subj.add,.x,.add-course,.rm-foot,.addrow,.pager{display:none!important}
  main{padding:0;max-width:none}
  .sheet{box-shadow:none;border-radius:0;margin:0;overflow:visible}
  .rm{zoom:.74;break-after:page}
  .sc{zoom:.86;break-inside:avoid}
  .tbl-wrap{overflow:visible}
  .course{break-inside:avoid}
  .blk{break-inside:avoid}
  input{border-color:transparent!important;background:transparent!important}
  input::placeholder{color:transparent}
  input[type=date]::-webkit-calendar-picker-indicator{display:none}
  .days textarea,.sum textarea{border:0;resize:none}
  .sp-head .ribbon{display:block}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="in">
    <div class="nav">
      <button class="btn" data-act="home" title="홈으로">🏠 홈</button>
      <button class="btn" data-act="back" id="backBtn" title="이전 화면">← 뒤로가기</button>
      <button class="btn pri" data-act="print" title="현재 화면 출력">🖨 출력</button>
    </div>
    <div class="ctx" id="ctx"></div>
    <span class="save" id="save" aria-live="polite"></span>
    <span class="authbox" id="auth"></span>
  </div>
</header>
<div class="hint" id="hint" hidden></div>
<main id="app"><div class="loading">불러오는 중…</div></main>
<div id="modal"></div>
<datalist id="subjlist"></datalist>
<script>
/* 기본 로드맵·수업일정 템플릿 (첨부 로드맵 이미지 기준) */

function weekday(str) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || "");
  if (!m) return "";
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return isNaN(d) ? "" : WD[d.getDay()];
}
function mixColor(t) {
  const a = [248, 211, 218], b = [228, 58, 85];
  const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function lsGet(k) { try { const v = localStorage.getItem("crm:" + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem("crm:" + k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem("crm:" + k); } catch (e) {} }
function lsKeys(prefix) {
  const out = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("crm:" + prefix)) out.push(k.slice(4)); } } catch (e) {}
  return out;
}

/* ================= 저장소 (Firebase, 설정 전에는 이 브라우저) ================= */
const DEL = Object.freeze({ __del: true });
const isObj = v => v && typeof v === "object" && !Array.isArray(v) && v !== DEL;
function deepMerge(a, b) {
  for (const k of Object.keys(b)) {
    if (isObj(b[k]) && isObj(a[k])) deepMerge(a[k], b[k]); else a[k] = b[k];
  }
  return a;
}
function secureId() {
  try { const a = new Uint8Array(12); crypto.getRandomValues(a); return "s" + Array.from(a, x => x.toString(36).padStart(2, "0")).join("").slice(0, 20); }
  catch (e) { return uid("s") + uid(); }
}
const Store = {
  fs: null, auth: null, m: null, a: null, user: null, staff: false, failed: false,
  configured() { return !!FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("여기") && !!FIREBASE_CONFIG.projectId; },
  get local() { return !this.configured() || this.failed; },
  async init() {
    if (!this.configured()) return;
    try {
      const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
      const [appM, authM, fsM] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
      const app = appM.initializeApp(FIREBASE_CONFIG);
      this.m = fsM; this.a = authM;
      this.fs = fsM.getFirestore(app);
      this.auth = authM.getAuth(app);
      try { await authM.getRedirectResult(this.auth); } catch (e) {}
      await new Promise(res => {
        let first = true;
        authM.onAuthStateChanged(this.auth, async u => {
          this.user = u;
          this.staff = u ? await this.checkStaff(u) : false;
          if (first) { first = false; res(); } else onAuthChange();
        });
      });
    } catch (e) {
      console.error(e);
      this.failed = true;
    }
  },
  async checkStaff(u) {
    if (!u.email) return false;
    try { const s = await this.m.getDoc(this.m.doc(this.fs, "admins", u.email)); return s.exists(); } catch (e) { return false; }
  },
  ref(path) { return this.m.doc(this.fs, ...path.split("/")); },
  async get(path) {
    if (this.local) return lsGet(path);
    try { const s = await this.m.getDoc(this.ref(path)); return s.exists() ? s.data() : null; }
    catch (e) { console.error(e); return null; }
  },
  async listStudents() {
    if (this.local) return lsKeys("students/").map(k => lsGet(k)).filter(Boolean);
    if (!this.staff) return [];
    try { const q = await this.m.getDocs(this.m.collection(this.fs, "students")); return q.docs.map(d => Object.assign(d.data(), { id: d.id })); }
    catch (e) { console.error(e); return []; }
  },
  async set(path, data) { await this.m.setDoc(this.ref(path), data); },
  async merge(path, data) {
    const conv = o => { const r = {}; for (const k of Object.keys(o)) r[k] = o[k] === DEL ? this.m.deleteField() : isObj(o[k]) ? conv(o[k]) : o[k]; return r; };
    await this.m.setDoc(this.ref(path), conv(data), { merge: true });
  },
  async del(path) { await this.m.deleteDoc(this.ref(path)); },
  async login() {
    const p = new this.a.GoogleAuthProvider();
    try { await this.a.signInWithPopup(this.auth, p); }
    catch (e) {
      if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) await this.a.signInWithRedirect(this.auth, p);
      else if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("로그인하지 못했어요: " + (e.code || e.message));
    }
  },
  async logout() { try { await this.a.signOut(this.auth); } catch (e) {} }
};
const canEdit = () => Store.local ? !Store.failed : Store.staff;

const pending = {}, timers = {}, busy = {};
let saveState = "idle";
function setSave(st, msg) {
  saveState = st;
  const el = $("#save");
  if (!el) return;
  el.className = "save" + (st === "error" ? " err" : "");
  el.textContent = msg ?? ({ saving: "저장 중…", saved: "저장됨", local: "이 브라우저에만 저장됨", error: "저장 실패", idle: "" }[st] || "");
}
function errMsg(e) {
  const c = e && e.code;
  if (c === "permission-denied") return "저장 권한이 없어요 (직원 로그인 확인)";
  if (c === "resource-exhausted") return "저장 한도를 넘었어요";
  return "저장 실패 (이 브라우저에는 보관됨)";
}
/* 문서 전체 저장 (로드맵·일정표·커리큘럼) */
function save(path, data) {
  lsSet(path, data);
  if (Store.local) { setSave("local"); return; }
  pending[path] = clone(data);
  clearTimeout(timers[path]);
  setSave("saving");
  timers[path] = setTimeout(() => flush(path), 700);
}
async function flush(path, retried) {
  if (busy[path]) { timers[path] = setTimeout(() => flush(path), 300); return; }
  const data = pending[path];
  if (!data) return;
  delete pending[path];
  busy[path] = true;
  try {
    await Store.set(path, data);
    if (!Object.keys(pending).length && !Object.keys(pendP).length) setSave("saved");
  } catch (e) {
    busy[path] = false;
    if (e && e.code === "unavailable" && !retried) { pending[path] = pending[path] || data; setTimeout(() => flush(path, true), 1000); return; }
    setSave("error", errMsg(e));
  } finally { busy[path] = false; }
}
/* 수강생은 바뀐 칸만 저장 (여러 명이 동시에 써도 서로 덮어쓰지 않음) */
const pendP = {}, timersP = {}, busyP = {}, creating = {};
function patchStudent(partial) {
  const st = S.cur;
  if (!st) return;
  st.updatedAt = Date.now();
  partial.updatedAt = st.updatedAt;
  lsSet("students/" + st.id, st);
  lsSet("pref:student", st.id);
  if (Store.local) { setSave("local"); return; }
  pendP[st.id] = deepMerge(pendP[st.id] || {}, partial);
  clearTimeout(timersP[st.id]);
  setSave("saving");
  timersP[st.id] = setTimeout(() => flushP(st.id), 600);
}
async function flushP(id) {
  if (busyP[id]) { timersP[id] = setTimeout(() => flushP(id), 300); return; }
  const data = pendP[id];
  if (!data) return;
  delete pendP[id];
  busyP[id] = true;
  try {
    if (creating[id]) await creating[id];
    await Store.merge("students/" + id, data);
    if (!Object.keys(pending).length && !Object.keys(pendP).length) setSave("saved");
  } catch (e) { setSave("error", errMsg(e)); }
  finally { busyP[id] = false; }
}
function createStudent(st) {
  lsSet("students/" + st.id, st);
  lsSet("pref:student", st.id);
  if (Store.local) { setSave("local"); return; }
  setSave("saving");
  creating[st.id] = Store.set("students/" + st.id, clone(st))
    .then(() => { if (!Object.keys(pending).length && !Object.keys(pendP).length) setSave("saved"); })
    .catch(e => setSave("error", errMsg(e)))
    .finally(() => { delete creating[st.id]; });
}
async function removeDoc(path) {
  lsDel(path);
  delete pending[path];
  clearTimeout(timers[path]);
  if (!Store.local) { try { await Store.del(path); } catch (e) { setSave("error", errMsg(e)); } }
}

    const msg = {

    }[S.mode];

function homeHTML() { return roadmapHTML() + scheduleHTML(); }

function roadmapHTML() {

    return `<section class="sheet rm"><div class="empty"><p>아직 로드맵이 없어요. 학원 기본 로드맵을 불러오거나 빈 과정부터 만들어 보세요.</p>
      <div class="btns"><button class="btn pri" data-act="loadRoadmap">기본 로드맵 불러오기</button><button class="btn" data-act="addCourse">빈 과정 만들기</button></div></div></section>`;
  }

    : `<h1>${esc(R.title)}</h1><div class="tags">${R.tags.filter(Boolean).map(t => `<span>${esc(t)}</span>`).join("")}</div>`;
  const body = R.courses.map((c, ci) => courseHTML(c, ci, sel, edit)).join("")

function courseHTML(c, ci, sel, edit) {
  const has = c.subjects.some(s => sel.has(s.id));
  const n = c.subjects.length;
  let items = "";
  c.subjects.forEach((s, i) => {
    if (s.br && i > 0) items += `<span class="brk"></span><span class="indent" aria-hidden="true"></span>`;
    const t = n > 1 ? i / (n - 1) : 1;
    const label = [s.name, s.level].filter(Boolean).join(" ").replace(/\n/g, " ");
    items += `<button type="button" class="subj${sel.has(s.id) ? " sel" : ""}" data-act="subj" data-c="${esc(c.id)}" data-s="${esc(s.id)}" style="--bar:${mixColor(t)}" aria-pressed="${sel.has(s.id)}" aria-label="${esc(label)}">`
      + `<span class="bar"></span><span class="nm">${esc(s.name)}</span>`
      + (s.level ? `<span class="lv">${esc(s.level)}</span>` : "")
      + (s.note ? `<span class="nt">${esc(s.note)}</span>` : "")
      + `<span class="ck" aria-hidden="true">✓</span></button>`;
  });
  if (edit) items += `<button type="button" class="subj add" data-act="addSubj" data-c="${esc(c.id)}"><span class="nm">+ 과목</span></button>`;

      <button data-act="cMove" data-c="${esc(c.id)}" data-d="-1" title="위로" aria-label="위로">▲</button>
      <button data-act="cMove" data-c="${esc(c.id)}" data-d="1" title="아래로" aria-label="아래로">▼</button>
      <button data-act="cDel" data-c="${esc(c.id)}" title="과정 삭제" aria-label="과정 삭제">🗑</button></div>` : "";
  return `<div class="course${has ? " has" : ""}${c.half ? " half" : ""}">
    <div class="clabel"${clickable ? ` data-act="course" data-c="${esc(c.id)}" role="button" tabindex="0" title="${S.mode === "check" ? "과정 전체 체크" : "과정 정보 수정"}"` : ""}>

function fillDatalist() {

/* ---------- 과목 상세 ---------- */
const SUMF = [["intro", "과목 소개"], ["goal", "학습 목표"], ["content", "주요 학습 내용"], ["result", "완성 결과물"], ["period", "수업 기간·시간"]];
function emptyCurr() { return { mode: "daily", days: [], summary: {} }; }
async function loadCurr(sid) {
  if (S.curr[sid] !== undefined || loadCurr.busy === sid) return;
  loadCurr.busy = sid;
  const d = await Store.get("curricula/" + sid);
  loadCurr.busy = null;
  S.curr[sid] = d ? Object.assign(emptyCurr(), d) : emptyCurr();
  if (S.page.name === "subject" && S.page.sid === sid) render();
}
function subjectHTML() {

  if (cur === undefined) { loadCurr(sid); return `<section class="sheet"><div class="loading">커리큘럼 불러오는 중…</div></section>`; }
  const tab = S.tab || cur.mode || "daily";
  const ed = S.subjEdit;
  const idx = c.subjects.indexOf(s);
  const prev = c.subjects[idx - 1], next = c.subjects[idx + 1];
  const nm = x => esc([x.name, x.level].filter(Boolean).join(" ").replace(/\n/g, " "));

  let body = "";
  if (tab === "daily") {
    if (!cur.days.length && !ed) {
      body = `<div class="empty"><p>아직 일자별 커리큘럼이 없어요.</p><div class="btns"><button class="btn rose" data-act="subjEdit">✏️ 회차 입력하기</button></div></div>`;

             <td class="nb"><input data-k="day" data-i="${i}" data-f="note" value="${esc(d.note)}" placeholder="비고" aria-label="${i + 1}회차 비고"></td>
             <td class="op no-print"><button data-act="dayMove" data-i="${i}" data-d="-1" aria-label="위로">▲</button> <button data-act="dayMove" data-i="${i}" data-d="1" aria-label="아래로">▼</button> <button data-act="dayDel" data-i="${i}" aria-label="삭제">×</button></td></tr>`
        : `<tr><td class="no">${i + 1}회차</td><td class="ttl">${esc(d.title)}</td><td>${esc(d.content)}</td><td class="nb">${esc(d.note)}</td></tr>`).join("");
      body = `<div style="overflow-x:auto"><table class="days"><thead><tr><th>회차</th><th>학습 주제</th><th>세부 내용</th><th>비고</th>${ed ? '<th class="no-print"></th>' : ""}</tr></thead><tbody>${rows}</tbody></table></div>
        ${ed ? `<div class="row-btns no-print"><button class="btn" data-act="dayAdd">+ 회차 추가</button><button class="btn" data-act="dayAddMany">회차 여러 개 만들기</button></div>` : ""}`;

      body = `<div class="empty"><p>아직 요약 커리큘럼이 없어요.</p><div class="btns"><button class="btn rose" data-act="subjEdit">✏️ 요약 입력하기</button></div></div>`;
    } else {
      body = `<div class="sum">` + (ed
        ? SUMF.map(([k, l]) => `<section><h3>${l}</h3><textarea data-k="sum" data-f="${k}" aria-label="${l}" placeholder="${l}을(를) 입력하세요">${esc(cur.summary[k] || "")}</textarea></section>`).join("")
        : filled.map(([k, l]) => `<section><h3>${l}</h3><p>${esc(cur.summary[k])}</p></section>`).join("")) + `</div>`;

  return `<section class="sheet">

    </div>
    <div class="sp-body">${body}</div>
    <div class="pager no-print">
      ${prev ? `<button class="btn" data-act="goSubj" data-c="${esc(c.id)}" data-s="${esc(prev.id)}">← ${nm(prev)}</button>` : "<span></span>"}
      ${next ? `<button class="btn" data-act="goSubj" data-c="${esc(c.id)}" data-s="${esc(next.id)}">${nm(next)} →</button>` : "<span></span>"}
    </div>

/* ================= 모달·토스트 ================= */
function modal({ title, body, actions }) {
  const box = $("#modal");
  box.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="mb">${body}</div>
    <div class="ma">${actions.map((a, i) => `<button class="btn ${a.cls || ""}" data-mi="${i}">${esc(a.label)}</button>`).join("")}</div></div></div>`;
  const close = () => { box.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  box.querySelector(".modal-bg").addEventListener("click", e => { if (e.target.classList.contains("modal-bg")) close(); });
  box.querySelectorAll("[data-mi]").forEach(b => b.addEventListener("click", () => {
    const a = actions[+b.dataset.mi];
    if (!a.fn || a.fn(box) !== false) close();
  }));
  setTimeout(() => { const f = box.querySelector("input,textarea"); (f || box.querySelector("[data-mi]:last-child"))?.focus(); }, 20);
  return box;
}
function confirmBox(title, msg, yes, fn) {
  modal({ title, body: `<p class="msg">${esc(msg)}</p>`, actions: [{ label: "취소" }, { label: yes, cls: "rose", fn }] });
}
let toastT;
function toast(msg) {
  let t = $(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastT);
  toastT = setTimeout(() => t.remove(), 2600);
}

/* ---------- 과목·과정 편집 모달 ---------- */
function editSubject(c, s) {
  const isNew = !s;
  const v = s || { name: "", level: "", note: "", br: false };
  const actions = [];
  if (!isNew) actions.push({ label: "삭제", cls: "danger left", fn: () => { setTimeout(() => delSubject(c, s), 0); } });
  if (!isNew) {
    actions.push({ label: "◀ 앞으로", fn: () => { moveSubj(c, s, -1); return false; } });
    actions.push({ label: "뒤로 ▶", fn: () => { moveSubj(c, s, 1); return false; } });
  }
  actions.push({ label: "취소" });
  actions.push({
    label: isNew ? "추가" : "저장", cls: "pri", fn: box => {
      const name = box.querySelector("#f-name").value.trim();
      if (!name) { toast("과목명을 입력하세요"); return false; }
      const o = isNew ? { id: uid(c.id + "-") } : s;
      o.name = name;
      o.level = box.querySelector("#f-level").value.trim();
      o.note = box.querySelector("#f-note").value.trim();
      o.br = box.querySelector("#f-br").checked;

function moveSubj(c, s, d) {

  await loadAll();
  setSave(Store.local ? "local" : "idle", Store.local && !Store.failed ? "이 브라우저에만 저장됨" : "");
  render();
})();

</script>
