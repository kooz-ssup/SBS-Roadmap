<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교육과정 로드맵 &amp; 수업일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2edf1; --paper:#ffffff; --ink:#27222c; --muted:#7c7383; --line:#e7dee5; --field:#faf6f9;
  --rose:#e43a55; --rose-d:#b81f3c; --blush:#f8d3da; --sel:#fff0f3; --navy:#2d2b63; --navy-ink:#ffffff;
  --bar-bg:rgba(255,255,255,.88); --shadow:0 1px 2px rgba(60,20,40,.06),0 8px 24px rgba(60,20,40,.06);
  --cell-on:#ffe9ee;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151216; --paper:#211c24; --ink:#f2edf3; --muted:#a99fb0; --line:#3a323f; --field:#2a242e;
    --rose:#ff5a74; --rose-d:#ff8fa2; --blush:#5a2633; --sel:#3a1d27; --navy:#4b48a8;
    --bar-bg:rgba(33,28,36,.88); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --cell-on:#43222c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151216; --paper:#211c24; --ink:#f2edf3; --muted:#a99fb0; --line:#3a323f; --field:#2a242e;
  --rose:#ff5a74; --rose-d:#ff8fa2; --blush:#5a2633; --sel:#3a1d27; --navy:#4b48a8;
  --bar-bg:rgba(33,28,36,.88); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --cell-on:#43222c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar-bg);backdrop-filter:blur(8px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
img{max-width:100%}

/* ── 상단 바 ── */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 16px}
.nav{display:flex;gap:6px}
.btn{height:34px;padding:0 12px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.rose{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.danger{color:var(--rose-d);border-color:var(--blush)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.ctx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1}
.spacer{flex:1}
.stu{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.stu select.scope{max-width:110px}
.stu select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 8px;max-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;height:32px;padding:0 12px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.save.err{color:var(--rose-d);font-weight:700}
.authbox{display:inline-flex;align-items:center;gap:6px}
.who{font-size:12px;font-weight:700;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{max-width:1320px;margin:12px auto 0;padding:0 16px}
.hint p{margin:0;padding:9px 14px;border-radius:10px;background:var(--sel);border:1px solid var(--blush);color:var(--rose-d);font-weight:600;font-size:13px}
.hint.edit p{background:color-mix(in srgb,var(--navy) 10%,var(--paper));border-color:color-mix(in srgb,var(--navy) 30%,var(--paper));color:var(--ink)}

main{max-width:1320px;margin:0 auto;padding:14px 16px 60px}
.sheet{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}

/* ── 로드맵 ── */
.rm-head{position:relative;color:#fff;padding:22px 28px;display:flex;align-items:center;gap:18px 26px;flex-wrap:wrap;
  background:
   radial-gradient(70% 160% at 4% 30%,rgba(255,138,160,.95) 0%,transparent 60%),
   radial-gradient(45% 140% at 42% -10%,rgba(255,184,120,.85) 0%,transparent 60%),
   radial-gradient(55% 170% at 98% 70%,rgba(160,48,140,.9) 0%,transparent 62%),
   radial-gradient(40% 120% at 70% 120%,rgba(232,60,110,.9) 0%,transparent 60%),
   linear-gradient(100deg,#ea4b6c,#f2745f 45%,#c9437f)}
.rm-head h1{margin:0;font-family:"Archivo Black","Arial Black",Impact,sans-serif;font-weight:400;font-size:clamp(26px,4.6vw,58px);line-height:1;letter-spacing:.005em;text-shadow:0 2px 0 rgba(90,10,40,.12)}
.rm-head .tags span{display:block;width:fit-content;background:#2d2b63;color:#fff;padding:3px 11px;margin:3px 0;font-weight:700;font-size:15px}
.rm-head input{background:rgba(255,255,255,.18);border:1px dashed rgba(255,255,255,.7);border-radius:6px;color:#fff;padding:4px 8px}
.rm-head input.t{font-family:"Archivo Black","Arial Black",sans-serif;font-size:clamp(22px,3.6vw,44px);width:min(640px,100%)}
.rm-head .tags input{display:block;margin:3px 0;font-weight:700;width:240px;background:#2d2b63}

.rm-body{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;padding:10px 24px 18px}
.course{grid-column:1/-1;display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:start;padding:12px 0 10px;border-bottom:1px dashed var(--line)}
.course.half{grid-column:auto;grid-template-columns:86px 1fr;gap:8px}
.course.half .subj{min-width:max(48px,min-content)}
.clabel{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border-radius:12px;padding:4px 2px;position:relative}
.clabel[role="button"]{cursor:pointer}
.clabel[role="button"]:hover .cicon{border-color:var(--rose)}
.cicon{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:25px;border:2px solid var(--line);background:var(--paper);box-shadow:inset 0 0 0 4px var(--field);transition:border-color .15s,box-shadow .15s}
.cname{font-weight:500;font-size:13.5px;line-height:1.25;word-break:keep-all;padding:2px 8px;border-radius:999px;transition:background .15s,color .15s}
.cname small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.course.has .cicon{border-color:var(--rose);box-shadow:inset 0 0 0 4px var(--sel),0 0 0 4px var(--blush)}
.cicon.img{border:0;box-shadow:none;background:none;overflow:hidden}
.cicon.img img{width:100%;height:100%;display:block}
.course.has .cicon.img{box-shadow:0 0 0 3px var(--rose)}
.crumb-ic{width:24px;height:24px;font-size:16px;display:grid;place-items:center}
.crumb-ic.img img{width:24px;height:24px;display:block}
.rm-headimg img{display:block;width:100%;height:auto}
.hdr-toggle{display:flex;align-items:center;gap:8px;padding:10px 24px;font-size:13px;font-weight:700;background:var(--field);border-bottom:1px solid var(--line)}
.course.has .cname{background:var(--rose);color:#fff}
.course.has .cname small{color:rgba(255,255,255,.85)}
.cctrl{display:flex;gap:3px;margin-top:2px}
.cctrl button{width:26px;height:24px;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-size:12px;padding:0}

.track{display:flex;flex-wrap:wrap;align-items:stretch;row-gap:12px;padding-top:4px;min-width:0}
.brk{flex-basis:100%;height:0}
.indent{width:26px;flex:none;position:relative}
.indent::before{content:"";position:absolute;left:10px;top:-12px;width:12px;height:22px;border-left:2px solid var(--blush);border-bottom:2px solid var(--blush);border-bottom-left-radius:8px}
.subj{flex:1 1 0;min-width:max(52px,min-content);max-width:136px;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:17px 4px 7px;background:none;border:2px solid transparent;border-radius:10px;text-align:center;color:var(--ink);transition:background .15s,border-color .15s,opacity .15s}
.subj .bar{position:absolute;left:-2px;right:-2px;top:3px;height:7px;background:var(--bar)}
.subj .bar::after{content:"";position:absolute;right:7px;top:1px;border-left:5px solid rgba(255,255,255,.95);border-top:2.5px solid transparent;border-bottom:2.5px solid transparent}
.track > .subj:first-child .bar{border-radius:4px 0 0 4px}
.track > .subj:last-child .bar{border-radius:0 4px 4px 0}
.subj .nm{font-weight:500;font-size:12.5px;line-height:1.25;white-space:pre-line;word-break:keep-all}
.subj .lv{font-size:11.5px;line-height:1.25;white-space:pre-line;word-break:keep-all}
.subj .nt{font-size:9.5px;line-height:1.2;color:var(--muted);word-break:keep-all}
.subj .ck{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--rose);color:#fff;font-size:12px;font-weight:800;display:none;place-items:center;box-shadow:0 0 0 2px var(--paper)}
.subj:hover{background:var(--field)}
.subj.sel{background:var(--sel);border-color:var(--rose)}
.subj.sel .nm{color:var(--rose-d)}
.subj.sel .ck{display:grid}
.subj.sel .nm{font-weight:700}
.subj.sel.jl{border-left-width:0;padding-left:6px;border-top-left-radius:0;border-bottom-left-radius:0}
.subj.sel.jr{border-right-width:0;padding-right:6px;border-top-right-radius:0;border-bottom-right-radius:0}
.subj.sel.jr .ck{display:none}
.rm.mode-check .track{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.subj.add{color:var(--muted);border:2px dashed var(--line);justify-content:center}
.subj.add .bar{display:none}
.rm.focus .course:not(.has){opacity:.4}
.rm.focus .subj:not(.sel){opacity:.42}
.rm.mode-check .subj{cursor:copy}
.add-course{grid-column:1/-1;margin-top:12px}
.rm-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 24px 16px;font-size:12px;color:var(--muted);align-items:center}

/* ── 수업일정 ── */
.sc{padding:0 0 18px}
.sc-head{background:#8eaadf;color:#1d2340;text-align:center;padding:10px 16px 8px}
.sc-head .ttl{font-size:21px;font-weight:800;display:flex;justify-content:center;align-items:baseline;gap:4px;flex-wrap:wrap}
.sc-head .ttl input{font-weight:800;text-align:right;width:9em}
.sc-head .note input{width:100%;text-align:center;font-size:13px}
.sc input{background:transparent;border:1px solid transparent;border-radius:5px;padding:2px 4px;min-width:0}
.sc input:hover{border-color:var(--line);background:var(--field)}
.sc input:focus{border-color:var(--rose);background:var(--paper);outline:none}
.sc-head input:hover,.sc-head input:focus{background:rgba(255,255,255,.55);color:#1d2340}
.sc-head input::placeholder{color:#4a5684}
.tbl-wrap{overflow-x:auto;padding:0 16px}
table.tt{border-collapse:collapse;width:100%;min-width:960px;font-size:12.5px;margin-top:0}
.tt th,.tt td{border:1px solid #c9c3cc;padding:0;height:24px;text-align:center}
.tt thead th{font-weight:800;background:var(--paper)}
.tt input{width:100%;text-align:center;height:22px;border-radius:0;font-weight:inherit}
.tt th.time{width:118px;font-weight:800}
.tt th.grp{width:44px;font-weight:800}
.tt th.grp input{writing-mode:horizontal-tb}
.tt td.on{background:var(--cell-on)}
.tt td input{font-size:11.5px;padding:2px 1px}
.tt td.on input{font-weight:700;color:var(--rose-d)}
.tt textarea.cellta{display:block;width:100%;min-height:22px;height:22px;border:1px solid transparent;border-radius:0;background:transparent;padding:3px 2px;font:inherit;font-size:11.5px;line-height:1.3;text-align:center;resize:none;overflow:hidden;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.tt textarea.cellta:hover{border-color:var(--line);background:var(--field)}
.tt textarea.cellta:focus{border-color:var(--rose);background:var(--paper);outline:none}
.tt td.on textarea.cellta{font-weight:700;color:var(--rose-d)}
.sugg{position:absolute;z-index:40;min-width:200px;max-width:280px;max-height:260px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(40,10,30,.18);padding:4px}
.sugg-h{margin:4px 8px 4px;font-size:11px;color:var(--muted)}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:13px}
.sugg button:hover,.sugg button.on{background:var(--sel);color:var(--rose-d)}
.tt tr.gstart > *{border-top:2px solid #8f8794}
.tt .x,.blk .x{border:0;background:var(--blush);color:var(--rose-d);width:18px;height:18px;border-radius:50%;font-size:12px;line-height:18px;padding:0;font-weight:800}
.tt th .cellx{display:flex;align-items:center;gap:2px;padding-right:3px}
.addrow td{border:0;text-align:left;padding:4px 0}
.acad-title{text-align:center;margin:22px 16px 10px;padding:8px;border-top:2px solid #8f8794;border-bottom:2px solid #8f8794}
.acad-title input{font-size:19px;font-weight:800;text-align:center;width:min(520px,100%)}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px;padding:0 16px}
.blk{position:relative}
.blk table{border-collapse:collapse;width:100%;font-size:12.5px}
.blk th,.blk td{border:1px solid #c9c3cc;height:24px;text-align:center;padding:0}
.blk th{background:#bfd6ee;font-weight:800;color:#1d2340}
.blk th.bm{width:22%}
.blk th input{font-weight:800;text-align:center;width:100%;color:#1d2340}
.blk td input{width:100%;text-align:center}
.blk td.wd{width:12%;font-weight:700}
.blk input.memo{text-align:left;font-size:12px}
.blk .x{position:absolute;top:-7px;right:-7px}
.wd.warn{color:var(--rose-d)}

/* ── 과목 상세 ── */
.sp-head{padding:22px 26px 0;border-bottom:1px solid var(--line);position:relative}
.sp-head .crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.sp-head .crumb b{color:var(--ink)}
.sp-head h2{margin:6px 0 2px;font-size:28px;line-height:1.2;font-weight:800;white-space:pre-line}
.sp-head h2 .lv{font-size:18px;color:var(--rose-d);margin-left:8px;font-weight:700}
.sp-head .nt{margin:0;color:var(--muted);font-size:13px}
.sp-head .ribbon{position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--blush),var(--rose))}
.tabs{display:flex;gap:4px;margin-top:16px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:800;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--rose)}
.sp-body{padding:20px 26px 26px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}
.empty .btns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
table.days{border-collapse:collapse;width:100%;font-size:14px}
.days th{background:var(--field);font-weight:800;text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.days td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:pre-line}
.days td.no{width:64px;font-weight:800;color:var(--rose-d);white-space:nowrap}
.days td.ttl{width:26%;font-weight:700}
.days td.nb{width:16%;color:var(--muted);font-size:13px}
.days td.op{width:92px;white-space:nowrap}
.days input,.days textarea,.sum textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--field);padding:6px 8px;resize:vertical}
.days textarea{min-height:58px}
.days .op button{width:26px;height:26px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:0;font-size:12px}
.row-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sum{display:grid;gap:16px}
.sum section{border-left:4px solid var(--rose);padding:2px 0 2px 14px}
.sum h3{margin:0 0 4px;font-size:14px;font-weight:800;color:var(--rose-d)}
.sum p{margin:0;white-space:pre-line;max-width:80ch}
.sum textarea{min-height:80px}
.goal{display:flex;gap:14px;align-items:center;margin:0;padding:14px 24px;background:linear-gradient(100deg,#fff4f6,#fff 60%);border-bottom:1px solid var(--blush)}
.goal-ic{font-size:30px;line-height:1}
.goal > div{flex:1;min-width:0}
.goal b{display:block;font-size:13px;color:var(--rose-d);font-weight:800;margin-bottom:2px}
.goal p{margin:0;font-size:19px;font-weight:700;white-space:pre-line;color:#2a2330}
.goal textarea{width:100%;font-size:18px;font-weight:700;border:1px dashed var(--blush);border-radius:8px;background:rgba(255,255,255,.7);padding:6px 10px;resize:vertical;color:#2a2330}
.goal textarea:focus{outline:none;border-color:var(--rose);border-style:solid;background:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .goal{background:linear-gradient(100deg,#3a1d27,var(--paper) 60%)}:root:not([data-theme="light"]) .goal p,:root:not([data-theme="light"]) .goal textarea{color:var(--ink)}:root:not([data-theme="light"]) .goal textarea{background:var(--field)}}
.subj.locked{cursor:not-allowed}
.subj.locked:hover{background:none}
.mentor .mine{font-size:12px;font-weight:600;color:var(--muted)}
.mentor.empty-m{background:var(--field);border-style:dashed;border-color:var(--line)}
.subj.pf .nm{color:var(--navy)}
.pf-ic{margin-right:2px}
.rm.focus .subj.pf{opacity:1}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;align-items:start}
.pf-item{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.pf-item img{display:block;width:100%;height:auto;background:#fff}
.pf-item.wide{grid-column:span 2}
.pf-video{position:relative;padding-top:56.25%;background:#000}
.pf-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pf-item.link a{display:flex;gap:12px;align-items:center;padding:16px;text-decoration:none;color:var(--ink)}
.pf-item.link a:hover{background:var(--field)}
.pf-link-ic{font-size:26px}
.pf-item.link b{display:block}
.pf-item small,.pf-url{display:block;color:var(--muted);font-size:12px;word-break:break-all}
.pf-url{padding:0 12px 10px;text-decoration:none}
.pf-cap{margin:8px 12px;font-size:13px;color:var(--ink)}
input.pf-cap{width:calc(100% - 24px);border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--field)}
.pf-op{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
@media screen and (max-width:620px){.pf-item.wide{grid-column:auto}}
.bm-l{font-weight:800;color:#1d2340}
.acad-title{position:relative}
.yctl{position:absolute;right:0;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.yctl b{color:var(--ink)}
@media screen and (max-width:860px){.yctl{position:static;transform:none;display:flex;justify-content:center;margin-top:6px}}
/* 하단 버튼 */
.home-actions{display:flex;justify-content:center;gap:12px;margin:6px 0 30px;flex-wrap:wrap}
.btn.lg{height:46px;padding:0 26px;font-size:15px;border-radius:12px}
.modal .pp{display:grid;gap:10px;padding:4px 2px}
.modal .pp label.chk{font-size:15px}
.modal .pp label.sub{margin-left:26px;font-size:13px;color:var(--muted)}
/* 탐색표 */
.ex{padding:30px 20px}
.ex.ex-off,.exg-print{display:none}
.ex-page{width:min(760px,100%);margin:0 auto;color:#111;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.ex textarea.exta{display:block;width:100%;border:1px dashed transparent;border-radius:4px;background:transparent;resize:none;overflow:hidden;font:inherit;color:inherit;line-height:1.45;padding:3px 4px;min-height:1.6em;white-space:pre-wrap}
.ex textarea.exta:hover{border-color:#cfc6cc;background:#fbf9fa}
.ex textarea.exta:focus{outline:none;border-color:var(--rose);border-style:solid;background:#fff}
.ex textarea.exta::placeholder{color:#b9b0b8;font-size:12px}
.ex textarea.exta.c,.ex textarea.exta.lab{text-align:center}
.ex-tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.tpl-list{display:grid;gap:8px;max-height:50vh;overflow:auto}
.tpl-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tpl-row b{display:block;font-size:14px}
.tpl-row small{color:var(--muted);font-size:12px}
.tpl-row > span{white-space:nowrap}
.ex-title{border:1.5px solid #222;border-bottom:0;background:#d9d9d9;padding:10px 8px}
.ex-title textarea.exta{font-size:24px;font-weight:700;text-align:center}
table.ex-t{border-collapse:collapse;width:100%;font-size:15px;table-layout:fixed;background:#fff}
.ex-t th,.ex-t td{border:1px solid #222;padding:8px 6px;vertical-align:middle}
.ex-t th{font-weight:400;text-align:center}
.ex-t td{text-align:left}
.ex-t tr{height:62px}
.ex-t td.c textarea + textarea{margin-top:2px}
.ex-guide{margin-top:18px;font-size:13px}
.ex-guide summary{cursor:pointer;font-weight:700;color:var(--muted)}
.exg-h{font-size:16px;margin:12px 0 8px}
table.exg-t{border-collapse:collapse;width:100%;font-size:14px}
.exg-t th,.exg-t td{border:1px solid #222;padding:8px}
.exg-t thead th{background:#d9d9d9;font-size:16px}
.exg-t td.c{text-align:center;width:52px}
.exg-t td:nth-child(2){width:32%}
.exg-note{border:1px solid #222;margin-top:22px;padding:14px 18px;position:relative}
.exg-nh{display:inline-block;background:#d9d9d9;padding:3px 14px;border-radius:4px;margin-bottom:6px}
.exg-note ul{margin:4px 0 0;padding-left:18px;line-height:1.7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ex{background:#fff}}
body.pm .ex,body.pm .exg-print{width:760px;max-width:none;padding:0}
.exta-print{display:none}
body.pm .ex textarea.exta{display:none!important}
body.pm .exta-print{display:block;white-space:pre-wrap;line-height:1.45;padding:3px 4px;min-height:1.6em;text-align:left;word-break:keep-all;overflow-wrap:anywhere}
body.pm .exta-print.c,body.pm .exta-print.lab{text-align:center}
.ex-title .exta-print{font-size:24px;font-weight:700;text-align:center}
body.pm[data-print~="ex"] .ex{display:block!important}
body.pm[data-print~="exg"] .exg-print{display:block!important}
.tpl-note{margin:0;padding:10px 16px;background:var(--field);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
.shared{margin:8px 0 0;font-size:13px;color:var(--muted)}
.simgs{display:grid;gap:16px}
.simg{margin:0;position:relative}
.simg img{display:block;width:100%;height:auto;max-width:1100px;margin:0 auto;border-radius:8px;border:1px solid var(--line);background:#fff;min-height:60px}
.simg.missing img{display:none}
.simg.missing::after{content:"이미지를 불러오지 못했어요";display:block;padding:20px;text-align:center;color:var(--muted)}
.simg-op{display:flex;gap:6px;justify-content:center;margin-top:8px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;margin-bottom:18px;background:var(--field)}
.drop.over{border-color:var(--rose);background:var(--sel)}
.drop p{margin:0 0 8px}
.drop .help{font-size:13px;color:var(--muted)}
.drop label.btn{cursor:pointer}
.sumtext{margin-top:18px}
.sumtext summary{cursor:pointer;font-weight:800;color:var(--muted);margin-bottom:12px}
.mentor{margin-top:28px;border-radius:14px;padding:18px 20px;background:linear-gradient(135deg,var(--sel),var(--field));border:1px solid var(--blush)}
.mentor h3{margin:0 0 10px;font-size:17px;font-weight:800;color:var(--rose-d)}
.mentor .help{margin:-4px 0 10px;font-size:12px;color:var(--muted)}
.mrow+.mrow{margin-top:12px}
.mrow h4{margin:0 0 3px;font-size:14px;font-weight:700}
.mrow p{margin:0;white-space:pre-line;line-height:1.6}
.mrow a{color:var(--rose-d);word-break:break-all}
.mrow textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:7px 9px;resize:vertical}
.pager{display:flex;justify-content:space-between;gap:10px;padding:0 26px 22px}
.pager .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis}

/* ── 모달·토스트 ── */
.modal-bg{position:fixed;inset:0;background:rgba(20,10,20,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--paper);border-radius:14px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0;padding:16px 18px 6px;font-size:17px}
.modal .mb{padding:6px 18px 4px;display:grid;gap:12px}
.modal label{display:grid;gap:4px;font-size:13px;font-weight:700}
.modal label.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.modal input[type=text],.modal input[type=number],.modal textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field);width:100%}
.modal .help{font-size:12px;color:var(--muted);font-weight:400}
.modal .ma{display:flex;gap:8px;padding:14px 18px 16px;flex-wrap:wrap}
.modal .ma .left{margin-right:auto}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.modal .fld{display:grid;gap:6px;font-size:13px}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}
.iconpick button{width:44px;height:44px;border-radius:50%;border:2px solid transparent;padding:0;background:none;overflow:hidden}
.iconpick button img{width:100%;height:100%;display:block}
.iconpick button[aria-pressed="true"]{border-color:var(--rose);box-shadow:0 0 0 2px var(--blush)}
/* 출력 직전 크기 측정용 (출력과 같은 배치) */
body.pm .rm,body.pm .sc{width:1300px;max-width:none}
body.pm main{max-width:none}
/* 출력 배치는 화면 크기와 상관없이 항상 PC 배치로 고정 */
body.pm .rm-body{grid-template-columns:1fr 1fr;padding:10px 24px 18px}
body.pm .course{grid-template-columns:100px 1fr;gap:12px}
body.pm .course.half{grid-column:auto;grid-template-columns:86px 1fr;gap:8px}
body.pm .cicon{width:54px;height:54px;font-size:25px}
body.pm .cname{font-size:13.5px;padding:2px 8px}
body.pm .blocks{grid-template-columns:repeat(2,minmax(0,1fr))}
body.pm .course{padding:7px 0 5px}
body.pm .track{row-gap:6px}
body.pm .subj{padding-top:15px;padding-bottom:3px}
body.pm .goal.empty-goal,body.pm .no-print,body.pm .hdr-toggle,body.pm .rm-foot,body.pm .addrow,body.pm .add-course,body.pm .subj.add,body.pm .cctrl{display:none!important}
.emojis button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:18px;padding:0}
.modal p.msg{margin:0;white-space:pre-line}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;z-index:60;max-width:90vw}
.loading{padding:60px;text-align:center;color:var(--muted)}

@media screen and (max-width:860px){
  .rm-body{grid-template-columns:1fr;padding:8px 12px 14px}
  .course.half{grid-column:1/-1}
  .course{grid-template-columns:72px 1fr;gap:8px}
  .cicon{width:44px;height:44px;font-size:20px}
  .cname{font-size:12px;padding:2px 6px}
  .blocks{grid-template-columns:1fr}
  .rm-head{padding:18px}
  .sp-head,.sp-body{padding-left:16px;padding-right:16px}
  .days td.op{width:auto}
  .topbar{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── 출력 ── */
@page{size:A4 landscape;margin:8mm}
@page ex{size:A4 portrait;margin:8mm}
@media print{
  :root,:root[data-theme="dark"]{
    --bg:#fff;--paper:#fff;--ink:#222;--muted:#6f6676;--line:#ddd3da;--field:#fff;--sel:#fff0f3;--blush:#f8d3da;--rose:#e43a55;--rose-d:#b81f3c;--navy:#2d2b63;--cell-on:#ffe9ee;color-scheme:light;
    padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  body::before,.topbar,.hint,.no-print,.cctrl,.subj.add,.x,.add-course,.rm-foot,.addrow,.pager{display:none!important}
  main{padding:0;max-width:none}
  .sheet{box-shadow:none;border-radius:0;margin:0;overflow:visible}
  .hdr-toggle{display:none!important}
  .course{padding:7px 0 5px}
  .track{row-gap:6px}
  .subj{padding-top:15px;padding-bottom:3px}
  .rm,.sc{width:1300px;max-width:none}
  .ex,.exg-print{display:none!important;page:ex;width:760px;max-width:none;padding:0;break-before:page;break-inside:avoid}
  body[data-print~="ex"] .ex{display:block!important;zoom:var(--exz,.9);margin:var(--exmt,0px) auto 0!important}
  body[data-print~="exg"] .exg-print{display:block!important;zoom:var(--exgz,.9);margin:var(--exgmt,0px) auto 0!important}
  .ex textarea.exta{border-color:transparent!important;background:transparent!important}
  .ex textarea.exta::placeholder{color:transparent}
  .home-actions,#modal,.toast,.sugg{display:none!important}
  .rm{zoom:var(--rmz,.8);margin:var(--rmmt,0px) auto 0!important}
  .sc{zoom:var(--scz,.8);margin:var(--scmt,0px) auto 0!important}
  body[data-print="page"] main > .sheet{margin:0 auto!important}
  .simg{break-inside:avoid}
  .goal.empty-goal{display:none!important}
  .goal textarea{border:0!important;background:transparent!important;resize:none}
  .mentor{break-inside:avoid}
  .sc{break-before:page}
  .rm,.sc{break-inside:avoid}
  body[data-print]:not([data-print~="rm"]) .rm{display:none!important}
  body[data-print]:not([data-print~="sc"]) .sc{display:none!important}
  body[data-print="page"] .ex,body[data-print="page"] .exg-print{display:none!important}
  body[data-print="page"] main > .sheet{width:1300px;zoom:var(--pgz,.8)}
  .tbl-wrap{overflow:visible}
  .course{break-inside:avoid}
  .blk{break-inside:avoid}
  input,textarea.cellta{border-color:transparent!important;background:transparent!important}
  input.nodate{color:transparent!important}
  input::placeholder{color:transparent}
  input[type=date]::-webkit-calendar-picker-indicator{display:none}
  .days textarea,.sum textarea{border:0;resize:none}
  .sp-head .ribbon{display:block}
}
</style>
</head>

function weekday(str) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || "");
  if (!m) return "";
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return isNaN(d) ? "" : WD[d.getDay()];
}
function mixColor(t) {
  const a = [248, 211, 218], b = [228, 58, 85];
  const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function lsGet(k) { try { const v = localStorage.getItem("crm:" + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem("crm:" + k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem("crm:" + k); } catch (e) {} }
function lsKeys(prefix) {
  const out = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("crm:" + prefix)) out.push(k.slice(4)); } } catch (e) {}
  return out;
}

/* ================= 저장소 (Firebase, 설정 전에는 이 브라우저) ================= */
const DEL = Object.freeze({ __del: true });
const isObj = v => v && typeof v === "object" && !Array.isArray(v) && v !== DEL;
function deepMerge(a, b) {
  for (const k of Object.keys(b)) {
    if (isObj(b[k]) && isObj(a[k])) deepMerge(a[k], b[k]); else a[k] = b[k];
  }
  return a;
}
function secureId() {
  try { const a = new Uint8Array(12); crypto.getRandomValues(a); return "s" + Array.from(a, x => x.toString(36).padStart(2, "0")).join("").slice(0, 20); }
  catch (e) { return uid("s") + uid(); }
}
const Store = {
  fs: null, auth: null, m: null, a: null, user: null, staff: false, failed: false,
  configured() { return !!FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("여기") && !!FIREBASE_CONFIG.projectId; },
  get local() { return !this.configured() || this.failed; },
  async init() {
    if (!this.configured()) return;
    try {
      const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
      const [appM, authM, fsM] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
      const app = appM.initializeApp(FIREBASE_CONFIG);
      this.m = fsM; this.a = authM;
      this.fs = fsM.getFirestore(app);
      this.auth = authM.getAuth(app);
      try { await authM.getRedirectResult(this.auth); } catch (e) {}
      await new Promise(res => {
        let first = true;
        authM.onAuthStateChanged(this.auth, async u => {
          this.user = u;
          this.staff = u ? await this.checkStaff(u) : false;
          if (!u) this.admin = false;
          if (first) { first = false; res(); } else onAuthChange();
        });
      });
    } catch (e) {
      console.error(e);
      this.failed = true;
    }
  },
  /* admins 문서가 있으면 직원, 그 문서의 role 값이 admin이면 관리자 */
  async checkStaff(u) {
    this.admin = false;
    if (!u.email) return false;
    try {
      const s = await this.m.getDoc(this.m.doc(this.fs, "admins", u.email));
      if (!s.exists()) return false;
      this.admin = String((s.data() || {}).role || "").trim().toLowerCase() === "admin";
      this.phone4 = String((s.data() || {}).phone4 || "").replace(/\D/g, "").slice(-4);
      return true;
    } catch (e) { return false; }
  },
  ref(path) { return this.m.doc(this.fs, ...path.split("/")); },
  async get(path) {
    if (this.local) return lsGet(path);
    try { const s = await this.m.getDoc(this.ref(path)); return s.exists() ? s.data() : null; }
    catch (e) { console.error(e); return null; }
  },
  async listCol(name) {
    if (this.local) return lsKeys(name + "/").map(k => Object.assign(lsGet(k) || {}, { id: k.split("/")[1] }));
    if (!this.staff) return [];
    try { const q = await this.m.getDocs(this.m.collection(this.fs, name)); return q.docs.map(d => Object.assign(d.data(), { id: d.id })); }
    catch (e) { console.error(e); return []; }
  },
  async listStudents() {
    if (this.local) return lsKeys("students/").map(k => lsGet(k)).filter(Boolean);
    if (!this.staff) return [];
    try {
      const col = this.m.collection(this.fs, "students");
      /* 관리자는 전체, 직원은 본인이 등록한 수강생만 불러옴 */
      const q = await this.m.getDocs(this.admin ? col : this.m.query(col, this.m.where("owner", "==", this.user.email)));
      return q.docs.map(d => Object.assign(d.data(), { id: d.id }));
    }
    catch (e) { console.error(e); return []; }
  },
  async set(path, data) { await this.m.setDoc(this.ref(path), data); },
  async merge(path, data) {
    const conv = o => { const r = {}; for (const k of Object.keys(o)) r[k] = o[k] === DEL ? this.m.deleteField() : isObj(o[k]) ? conv(o[k]) : o[k]; return r; };
    await this.m.setDoc(this.ref(path), conv(data), { merge: true });
  },
  async del(path) { await this.m.deleteDoc(this.ref(path)); },
  async login() {
    const p = new this.a.GoogleAuthProvider();
    try { await this.a.signInWithPopup(this.auth, p); }
    catch (e) {
      if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) await this.a.signInWithRedirect(this.auth, p);
      else if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("로그인하지 못했어요: " + (e.code || e.message));
    }
  },
  async logout() { try { await this.a.signOut(this.auth); } catch (e) {} }
};
/* canEdit: 수강생 체크·일정 입력 가능 (직원 이상) / canAdmin: 로드맵·커리큘럼·학사일정 수정 가능 (관리자) */

const canAdmin = () => Store.local ? !Store.failed : (Store.staff && Store.admin);
const STUDENT_KEYS = new Set(["sname", "cell", "goal", "mymentor", "pfcap", "ex"]);

const pending = {}, timers = {}, busy = {};
let saveState = "idle";
function setSave(st, msg) {
  saveState = st;
  const el = $("#save");
  if (!el) return;
  el.className = "save" + (st === "error" ? " err" : "");
  el.textContent = msg ?? ({ saving: "저장 중…", saved: "저장됨", local: "이 브라우저에만 저장됨", error: "저장 실패", idle: "" }[st] || "");
}
function errMsg(e) {
  const c = e && e.code;
  if (c === "permission-denied") return "저장 권한이 없어요 (직원 로그인 확인)";
  if (c === "resource-exhausted") return "저장 한도를 넘었어요";
  return "저장 실패 (이 브라우저에는 보관됨)";
}
/* 문서 전체 저장 (로드맵·일정표·커리큘럼) */
function save(path, data) {
  lsSet(path, data);
  if (Store.local) { setSave("local"); return; }
  pending[path] = clone(data);
  clearTimeout(timers[path]);
  setSave("saving");
  timers[path] = setTimeout(() => flush(path), 700);
}
async function flush(path, retried) {
  if (busy[path]) { timers[path] = setTimeout(() => flush(path), 300); return; }
  const data = pending[path];
  if (!data) return;
  delete pending[path];
  busy[path] = true;
  try {
    await Store.set(path, data);
    if (!Object.keys(pending).length && !Object.keys(pendP).length) setSave("saved");
  } catch (e) {
    busy[path] = false;
    if (e && e.code === "unavailable" && !retried) { pending[path] = pending[path] || data; setTimeout(() => flush(path, true), 1000); return; }
    setSave("error", errMsg(e));
  } finally { busy[path] = false; }
}
/* 수강생은 바뀐 칸만 저장 (여러 명이 동시에 써도 서로 덮어쓰지 않음) */
const pendP = {}, timersP = {}, busyP = {}, creating = {};
function patchStudent(partial) {
  const st = S.cur;
  if (!st) return;
  st.updatedAt = Date.now();
  partial.updatedAt = st.updatedAt;
  lsSet("students/" + st.id, st);
  lsSet("pref:student", st.id);
  if (Store.local) { setSave("local"); return; }
  pendP[st.id] = deepMerge(pendP[st.id] || {}, partial);
  clearTimeout(timersP[st.id]);
  setSave("saving");
  timersP[st.id] = setTimeout(() => flushP(st.id), 600);
}
async function flushP(id) {
  if (busyP[id]) { timersP[id] = setTimeout(() => flushP(id), 300); return; }
  const data = pendP[id];
  if (!data) return;
  delete pendP[id];
  busyP[id] = true;
  try {
    if (creating[id]) await creating[id];
    await Store.merge("students/" + id, data);
    if (!Object.keys(pending).length && !Object.keys(pendP).length) setSave("saved");
  } catch (e) { setSave("error", errMsg(e)); }
  finally { busyP[id] = false; }
}
function createStudent(st) {
  lsSet("students/" + st.id, st);
  lsSet("pref:student", st.id);
  if (Store.local) { setSave("local"); return; }
  setSave("saving");
  creating[st.id] = Store.set("students/" + st.id, clone(st))
    .then(() => { if (!Object.keys(pending).length && !Object.keys(pendP).length) setSave("saved"); })
    .catch(e => setSave("error", errMsg(e)))
    .finally(() => { delete creating[st.id]; });
}
async function removeDoc(path) {
  lsDel(path);
  delete pending[path];
  clearTimeout(timers[path]);
  if (!Store.local) { try { await Store.del(path); } catch (e) { setSave("error", errMsg(e)); } }
}

  return (S.schedule?.blocks || []).slice().sort((x, y) => {

function blockView() {
  if (tplMode()) return { list: masterBlocks().map(b => Object.assign({ key: b.id }, b)), y0: 0, m0: 0 };
  const st = S.cur, master = masterBlocks();
  const byYm = {}; master.forEach(b => { const ym = ymOf(b); if (ym && !byYm[ym]) byYm[ym] = b; });
  const cols = S.schedule.months.map(m => monthNum(monthLabel(m))).filter(Boolean);
  if (!cols.length) return { list: [], y0: 0, m0: 0 };
  const m0 = cols[0];
  let y0 = st?.year0 || 0;
  if (!y0) {
    /* 기준 연도: 첫 달이 오늘과 가장 가까운 해 */
    const now = new Date(); const t = now.getFullYear() * 12 + now.getMonth();
    let best = null;
    for (let y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) {
      const d = Math.abs(y * 12 + (m0 - 1) - t);
      const has = byYm[`${y}-${String(m0).padStart(2, "0")}`] ? 0 : 0.5;
      if (!best || d + has < best.d) best = { d: d + has, y };
    }
    y0 = best.y;
  }
  const ov = st?.blkOv || {};
  const list = []; let y = y0, prev = 0;
  cols.forEach((m, j) => {
    if (j > 0 && m <= prev) y++;
    prev = m;
    const ym = `${y}-${String(m).padStart(2, "0")}`;
    const base = byYm[ym], o = ov[ym];

/* 시간표 칸 추천 목록 팝업 (직접 입력도 가능) */
const Sugg = {
  el: null, input: null, items: [], idx: -1,
  ensure() {
    if (this.el) return;

    document.body.appendChild(this.el);
    this.el.addEventListener("mousedown", e => { const b = e.target.closest("[data-v]"); if (b) { e.preventDefault(); this.pick(b.dataset.v); } });
  },
  open(input) {
    if (input.readOnly) return;
    this.ensure(); this.input = input; this.update();
  },
  update() {
    if (!this.input) return;
    const q = this.input.value.trim().toLowerCase();
    const all = suggestNames();
    this.items = q ? all.filter(n => n.toLowerCase().includes(q) && n.toLowerCase() !== q) : all;
    this.idx = -1;
    if (!this.items.length) { this.hide(); return; }

    const r = this.input.getBoundingClientRect();
    this.el.style.left = Math.min(window.innerWidth - 240, Math.max(4, r.left + window.scrollX)) + "px";
    this.el.style.top = (r.bottom + window.scrollY + 2) + "px";
    this.el.hidden = false;
  },
  move(d) {
    if (this.el?.hidden || !this.items.length) return false;
    this.idx = (this.idx + d + this.items.length) % this.items.length;
    this.el.querySelectorAll("[data-i]").forEach(b => b.classList.toggle("on", +b.dataset.i === this.idx));

  },
  pick(v) {
    const t = this.input; if (!t) return;

  hide() { if (this.el) this.el.hidden = true; this.idx = -1; }

document.addEventListener("focusin", e => { if (e.target.matches?.("textarea.cellta")) Sugg.open(e.target); });

document.addEventListener("keydown", e => {
  if (!e.target.matches?.("textarea.cellta")) return;
  if (e.key === "ArrowDown" && Sugg.move(1)) e.preventDefault();
  else if (e.key === "ArrowUp" && Sugg.move(-1)) e.preventDefault();
  else if (e.key === "Escape") Sugg.hide();

});

function studentForm(st) {

          } else {

        };

function embedURL(url) {
  try {
    const u = new URL(url), h = u.hostname.replace(/^www\.|^m\./, "");
    let id = "";
    if (h === "youtu.be") id = u.pathname.slice(1);
    else if (h.endsWith("youtube.com")) id = u.searchParams.get("v") || (u.pathname.match(/\/(shorts|embed|live)\/([^/?]+)/) || [])[2] || "";
    if (id) return "https://www.youtube.com/embed/" + encodeURIComponent(id.split(/[?&]/)[0]);
    if (h === "vimeo.com") { const v = u.pathname.match(/\/(\d+)/); if (v) return "https://player.vimeo.com/video/" + v[1]; }
    if (h === "drive.google.com") { const d = u.pathname.match(/\/file\/d\/([^/]+)/); if (d) return "https://drive.google.com/file/d/" + d[1] + "/preview"; }
  } catch (e) {}
  return "";
}

/* 이미지를 줄여서(1MB 이하) 보관 */
function readImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("이미지를 읽을 수 없어요")); };
    im.src = url;
  });
}
async function compressImage(file) {
  const im = await readImage(file);
  const cv = document.createElement("canvas");
  const webp = cv.toDataURL("image/webp").startsWith("data:image/webp");
  const type = webp ? "image/webp" : "image/jpeg";
  let maxW = 2000, q = 0.9;
  for (let t = 0; t < 10; t++) {
    const sc = Math.min(1, maxW / im.naturalWidth);
    const w = Math.max(1, Math.round(im.naturalWidth * sc)), h = Math.max(1, Math.round(im.naturalHeight * sc));
    cv.width = w; cv.height = h;
    const g = cv.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
    g.drawImage(im, 0, 0, w, h);
    const data = cv.toDataURL(type, q);
    if (data.length <= 900000) return { data, w, h };
    if (q > 0.65) q -= 0.1; else maxW = Math.round(maxW * 0.8);
  }
  throw new Error("이미지가 너무 커요");
}
async function addImages(files) {
  const cur = curOf(), k = pageKey();
  if (!cur || !canAdmin()) return;
  const list = Array.from(files || []).filter(f => f.type && f.type.startsWith("image/"));
  if (!list.length) { toast("이미지 파일만 올릴 수 있어요"); return; }
  setSave("saving", "이미지 올리는 중…");
  let ok = 0;
  for (const f of list) {
    try {
      const { data, w, h } = await compressImage(f);
      const id = uid("img");
      if (Store.local) lsSet("images/" + id, { data, w, h });
      else await Store.set("images/" + id, { data, w, h, createdAt: Date.now() });

    } catch (e) { console.error(e); setSave("error", e.code ? errMsg(e) : (e.message || "이미지 저장 실패")); }
  }
  if (ok) {
    save("curricula/" + k, cur);

/* ================= 모달·토스트 ================= */
function modal({ title, body, actions }) {
  const box = $("#modal");
  box.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="mb">${body}</div>
    <div class="ma">${actions.map((a, i) => `<button class="btn ${a.cls || ""}" data-mi="${i}">${esc(a.label)}</button>`).join("")}</div></div></div>`;
  const close = () => { box.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  box.querySelector(".modal-bg").addEventListener("click", e => { if (e.target.classList.contains("modal-bg")) close(); });
  box.querySelectorAll("[data-mi]").forEach(b => b.addEventListener("click", () => {
    const a = actions[+b.dataset.mi];
    if (!a.fn || a.fn(box) !== false) close();
  }));
  setTimeout(() => { const f = box.querySelector("input,textarea"); (f || box.querySelector("[data-mi]:last-child"))?.focus(); }, 20);
  return box;
}
function confirmBox(title, msg, yes, fn) {
  modal({ title, body: `<p class="msg">${esc(msg)}</p>`, actions: [{ label: "취소" }, { label: yes, cls: "rose", fn }] });
}
let toastT;
function toast(msg) {
  let t = $(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastT);
  toastT = setTimeout(() => t.remove(), 2600);
}

        const od = S.curr[oldKey] || await Store.get("curricula/" + oldKey) || await Store.get("curricula/" + o.id);

      actions: [{ label: "취소" }, {

          const n = Math.max(1, Math.min(60, parseInt(box.querySelector("#f-n").value, 10) || 0));
          const cur = curOf();
          for (let i = 0; i < n; i++) cur.days.push({ id: uid("d"), title: "", content: "", note: "" });
          saveCur(); render();
        }
      }]
    });
  },
  dayMove(el) {
    const cur = curOf(), i = +el.dataset.i, j = i + (+el.dataset.d);
    if (j < 0 || j >= cur.days.length) return;
    [cur.days[i], cur.days[j]] = [cur.days[j], cur.days[i]]; saveCur(); render();
  },
  dayDel(el) {
    const cur = curOf(), i = +el.dataset.i;
    const d = cur.days[i];
    const doDel = () => { cur.days.splice(i, 1); saveCur(); render(); };
    if ((d.title + d.content + d.note).trim()) confirmBox("회차 삭제", `${i + 1}회차를 삭제할까요?`, "삭제", doDel); else doDel();
  },
};
function focusLastDay() { setTimeout(() => { const all = document.querySelectorAll('[data-k="day"][data-f="title"]'); all[all.length - 1]?.focus(); }, 20); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const fn = ACT[act];
  if (!fn) return;
  e.preventDefault();
  if (ADMIN_ACTS.has(act) && !canAdmin()) { toast("관리자만 할 수 있어요"); return; }
  fn(el, e);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('.clabel[role="button"]')) { e.preventDefault(); ACT.course(e.target); }
});
document.addEventListener("change", e => {
  if (e.target.dataset?.k === "month" && (tplMode() || stuScope())) {
    /* 월 입력 정리: 숫자만 넣어도 ‘9월’로, 뒤 칸은 10월·11월…로 자동 채움 */
    const L = S.schedule.months, i = L.findIndex(x => x.id === e.target.dataset.id);
    const n = monthNum(e.target.value);
    if (i >= 0 && n) {
      const lab = j => (((n - 1 + (j - i)) % 12) + 1) + "월";
      if (tplMode()) { for (let j = i; j < L.length; j++) L[j].label = lab(j); saveSchedule(); }
      else { const mm = stuMonths(S.cur); for (let j = i; j < L.length; j++) mm[L[j].id] = lab(j); patchStudent({ months: clone(mm) }); }
      render();
    }
    return;
  }
  if (e.target.dataset?.k === "blk" && e.target.dataset.f === "start" && tplMode()) { render(); return; }
  if (e.target.dataset?.k === "ex" && e.target.dataset.key === "course" && e.target.dataset.f === "v") { courseAutoFill(e.target.value); return; }
  if (e.target.id === "scopeSel") {
    S.showAll = e.target.value === "all"; lsSet("pref:showAll", S.showAll);
    pickVisible(lsGet("pref:student"));
    render();
  } else if (e.target.id === "stuSel") {
    S.showEx = false;
    S.cur = S.students.find(s => s.id === e.target.value) || null;
    if (S.cur) lsSet("pref:student", S.cur.id);
    render();
  } else if (e.target.id === "focusChk") {
    S.focus = e.target.checked; lsSet("pref:focus", S.focus); render();
  }
});

/* ================= 입력 동작 ================= */
const IN = {
  sname(el) {
    const st = ensureStudent(); st.name = el.value; patchStudent({ name: el.value });
    const sel = $("#stuSel");
    if (sel) {
      let o = sel.querySelector(`option[value="${CSS.escape(st.id)}"]`);
      if (!o) { renderBar(); return; }
      o.textContent = stuLabel(st, Store.admin && S.showAll);
    }
  },
  cell(el) {
    const st = ensureStudent(); st.cells = st.cells || {};
    const v = el.value;
    if (v.trim()) st.cells[el.dataset.key] = v; else delete st.cells[el.dataset.key];
    el.parentElement.classList.toggle("on", !!v.trim());
    el.style.height = "auto"; el.style.height = Math.max(22, el.scrollHeight) + "px";
    Sugg.update();
    patchStudent({ cells: { [el.dataset.key]: v.trim() ? v : DEL } });
    if (!$("#stuSel")?.querySelector(`option[value="${CSS.escape(st.id)}"]`)) renderBar();
  },
  note(el) { S.schedule.note = el.value; saveSchedule(); },
  tableTitle(el) { S.schedule.tableTitle = el.value; saveSchedule(); },
  timeLabel(el) { S.schedule.timeLabel = el.value; saveSchedule(); },
  acadTitle(el) {
    if (tplMode()) { S.schedule.acadTitle = el.value; saveSchedule(); return; }
    if (!stuScope()) return;
    S.cur.acadTitle = el.value; patchStudent({ acadTitle: el.value });
  },
  month(el) {
    const m = S.schedule.months.find(x => x.id === el.dataset.id); if (!m) return;
    if (tplMode()) { m.label = el.value; saveSchedule(); return; }
    if (!stuScope()) return;
    const mm = stuMonths(S.cur); mm[m.id] = el.value; patchStudent({ months: clone(mm) });
  },
  grp(el) { const g = S.schedule.groups.find(x => x.id === el.dataset.id); if (g) { g.label = el.value; saveSchedule(); } },
  rowlabel(el) {
    const g = S.schedule.groups.find(x => x.id === el.dataset.g), r = g?.rows.find(x => x.id === el.dataset.id);
    if (r) { r.label = el.value; saveSchedule(); }
  },
  blk(el) {
    const f = el.dataset.f, id = el.dataset.id;
    if (el.type === "date") el.classList.toggle("nodate", !el.value);
    if (tplMode()) {
      const b = S.schedule.blocks.find(x => x.id === id); if (!b) return;
      b[f] = el.value;
      /* 개강일을 넣으면 이름(○월)도 자동으로 */
      if (f === "start" && /^\d{4}-\d{2}/.test(el.value) && (!b.label || monthNum(b.label) || b.label === "새 일정")) {
        b.label = (+el.value.slice(5, 7)) + "월";
        const li = el.closest(".blk")?.querySelector('[data-f="label"]'); if (li) li.value = b.label;
      }
      saveSchedule();
    } else if (stuScope()) {
      const st = S.cur; st.blkOv = st.blkOv || {};
      (st.blkOv[id] = st.blkOv[id] || {})[f] = el.value;
      patchStudent({ blkOv: { [id]: { [f]: el.value } } });
    } else return;
    if (f === "start" || f === "end") { const w = document.getElementById(`wd-${f}-${id}`); if (w) w.textContent = weekday(el.value); }
  },
  hdrimg(el) { S.roadmap.headerImg = el.checked; saveRoadmap(); render(); },
  rmtitle(el) { S.roadmap.title = el.value; saveRoadmap(); },
  rmtag(el) { S.roadmap.tags[+el.dataset.i] = el.value; saveRoadmap(); },
  day(el) { const cur = curOf(); const d = cur?.days[+el.dataset.i]; if (d) { d[el.dataset.f] = el.value; saveCur(); } },
  sum(el) { const cur = curOf(); if (cur) { cur.summary[el.dataset.f] = el.value; saveCur(); } },
  pfcap(el) {
    const L = pfList(true), it = L[+el.dataset.i]; if (!it) return;
    it[el.dataset.f || "cap"] = el.value; savePf();
  },
  ex(el) {
    if (!exCanEdit()) return;
    const st = S.cur; st.explore = st.explore || {};
    const f = el.dataset.f, key = el.dataset.key, v = el.value;
    if (f === "title") { st.explore.title = v; patchStudent({ explore: { title: v } }); }
    else { (st.explore[f] = st.explore[f] || {})[key] = v; patchStudent({ explore: { [f]: { [key]: v } } }); }
    el.style.height = "auto"; el.style.height = el.scrollHeight + "px";
  },
  goal(el) {
    const st = ensureStudent(); st.goal = el.value; patchStudent({ goal: el.value });
    el.closest(".goal")?.classList.toggle("empty-goal", !el.value.trim());
  },
  mymentor(el) {
    const s = pageSubject(); if (!s || !Store.user && !Store.local) return;
    const id = mentorId(s, myEmail() || "local");
    const m = S.mentor[id] || (S.mentor[id] = {});
    m[el.dataset.f] = el.value;
    saveMentor(s);
  }
};
document.addEventListener("input", e => {
  const k = e.target.dataset?.k;
  if (!k || !IN[k] || !canEdit()) return;
  if (SCOPED_KEYS.has(k)) { if (!tplMode() && !stuScope()) return; }
  else if (!STUDENT_KEYS.has(k) && !canAdmin()) return;
  IN[k](e.target);
});


/* ================= 드래그로 여러 과목 체크 ================= */
let drag = null;
function rerenderCourse(cid) {
  const c = findCourse(cid); if (!c) return;
  const el = document.querySelector(`.course[data-cid="${CSS.escape(cid)}"]`); if (!el) return;
  const sel = selSet();
  el.outerHTML = courseHTML(c, S.roadmap.courses.indexOf(c), sel, S.mode === "edit");
}
function dragIds() {
  const c = findCourse(drag.cid);
  const a = Math.min(drag.start, drag.cur), b = Math.max(drag.start, drag.cur);
  return c.subjects.slice(a, b + 1).filter(s => s.kind !== "pf").map(s => s.id);
}
document.addEventListener("pointerdown", e => {
  if (S.mode !== "check" || S.page.name !== "home" || !canEdit() || e.button > 0) return;
  const el = e.target.closest(".subj[data-s]"); if (!el || el.classList.contains("pf")) return;
  const c = findCourse(el.dataset.c); if (!c) return;
  const idx = c.subjects.findIndex(s => s.id === el.dataset.s); if (idx < 0) return;
  if (!S.cur) return; /* 수강생이 없으면 클릭 시 새 수강생 창이 뜸 */
  const st = ensureStudent();
  drag = { cid: c.id, start: idx, cur: idx, on: !(st.checked || {})[el.dataset.s] };
  S.preview = { ids: new Set(dragIds()), on: drag.on };
  if (e.pointerType === "mouse") e.preventDefault();
  rerenderCourse(c.id);
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const t = document.elementFromPoint(e.clientX, e.clientY)?.closest(".subj[data-s]");
  if (!t || t.dataset.c !== drag.cid) return;
  const c = findCourse(drag.cid);
  const i = c.subjects.findIndex(s => s.id === t.dataset.s);
  if (i < 0 || i === drag.cur) return;
  drag.cur = i;
  S.preview = { ids: new Set(dragIds()), on: drag.on };
  rerenderCourse(drag.cid);
});
function endDrag() {
  if (!drag) return;
  const ids = dragIds(), on = drag.on;
  drag = null; S.preview = null;
  const st = ensureStudent(); st.checked = st.checked || {};
  const part = {};
  ids.forEach(id => { if (on) { st.checked[id] = true; part[id] = true; } else { delete st.checked[id]; part[id] = DEL; } });
  patchStudent({ checked: part });
  S.justDragged = true;
  setTimeout(() => { S.justDragged = false; }, 0);
  render();
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

/* ================= 출력 (A4 가로 한 장에 맞춤) ================= */
const PAGE_W = 1062, PAGE_H = 728, DESIGN_W = 1300;
const EX_PAGE_W = 733, EX_PAGE_H = 1056, EX_W = 760;
/* 출력 준비: 배치를 출력용으로 바꾸고, A4 가로 한 장에 맞는 배율을 계산 */
let printPrep = null;
function prepPrint(which) {
  if (printPrep) return;
  const wasEdit = S.mode === "edit";
  if (wasEdit) { S.mode = "view"; render(); }
  const b = document.body;
  b.dataset.print = which;
  b.classList.add("pm");
  /* 탐색표 칸은 출력용 글자 상자로 바꿔서 출력 (입력칸은 출력 시 높이가 틀어지는 경우가 있음) */
  document.querySelectorAll("textarea.exta").forEach(t => {
    const d = document.createElement("div");
    d.className = "exta-print " + t.className.replace("exta", "");
    d.textContent = t.value;
    t.after(d);
  });
  autosizeCells();
  const SAFE = 0.96;
  /* 출력 시 글자 렌더링 차이로 높이가 몇 % 늘어나는 것을 감안 */
  const GROW = 1.07;
  const fitZ = (w, h) => Math.min(PAGE_W / w * 0.98, PAGE_H * SAFE / (h * GROW));
  const topM = (h, z) => Math.max(0, (PAGE_H - h * 1.035 * z) / 2) / z + "px";
  const rmEl = document.querySelector(".rm");
  if (rmEl) {
    /* 가로 폭을 바꿔 보며 한 장에 가장 크게 들어가는 폭을 고름 */
    let best = { z: 0, w: DESIGN_W };
    for (let w = 1300; w <= 2200; w += 100) {
      rmEl.style.width = w + "px";
      const z = fitZ(w, rmEl.scrollHeight || 1);
      if (z > best.z) best = { z, w };
    }
    rmEl.style.width = best.w + "px";
    b.style.setProperty("--rmz", best.z);
    b.style.setProperty("--rmmt", topM(rmEl.scrollHeight || 1, best.z));
  }
  const scEl = document.querySelector(".sc");
  if (scEl) {
    const h = scEl.scrollHeight || 1;
    const z = fitZ(DESIGN_W, h);
    b.style.setProperty("--scz", z);
    b.style.setProperty("--scmt", topM(h, z));
  }
  /* 탐색표: A4 세로 */
  [[".ex", "ex"], [".exg-print", "exg"]].forEach(([sel, v]) => {
    const el = document.querySelector(sel); if (!el) return;
    const h = el.scrollHeight || 1;
    const z = Math.min(EX_PAGE_W / EX_W * 0.98, EX_PAGE_H * SAFE / (h * GROW));
    b.style.setProperty(`--${v}z`, z);
    b.style.setProperty(`--${v}mt`, Math.max(0, (EX_PAGE_H - h * 1.035 * z) / 2) / z + "px");
  });
  b.style.setProperty("--pgz", PAGE_W / DESIGN_W * SAFE);
  printPrep = { wasEdit };
}
function endPrint() {
  if (!printPrep) return;
  const { wasEdit } = printPrep;
  printPrep = null;
  const b = document.body;
  b.classList.remove("pm"); delete b.dataset.print;
  document.querySelectorAll(".exta-print").forEach(d => d.remove());
  const r = document.querySelector(".rm"); if (r) r.style.width = "";
  if (wasEdit) { S.mode = "edit"; render(); }
}
function doPrint(which) {
  prepPrint(which);
  try { window.print(); } catch (e) { toast("출력 창을 열 수 없어요. Ctrl+P로 인쇄하세요"); }
  /* 일부 브라우저는 출력 완료 신호를 보내지 않으므로, 다음 클릭 때 원래 화면으로 되돌림 */
  setTimeout(() => document.addEventListener("pointerdown", endPrint, { once: true }), 0);
}
/* Ctrl+P로 바로 인쇄해도 한 장에 맞춤 (홈 화면은 로드맵+일정표 모두) */
window.addEventListener("beforeprint", () => { prepPrint(S.page.name === "home" ? ("rm sc" + (S.showEx && S.cur ? " ex" : "")) : "page"); });
window.addEventListener("afterprint", endPrint);

/* 페이지를 닫기 전에 남은 저장 처리 */
window.addEventListener("pagehide", () => { Object.keys(pending).forEach(p => flush(p)); Object.keys(pendP).forEach(id => flushP(id)); });

/* ================= 시작 ================= */
const LINK_ID = (() => { try { return new URLSearchParams(location.search).get("s") || ""; } catch (e) { return ""; } })();
async function loadAll() {
  const [rm, sc, studs] = await Promise.all([Store.get("app/roadmap"), Store.get("app/schedule"), Store.listStudents()]);
  S.roadmap = rm;
  S.schedule = sc;
  S.students = studs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  S.studentView = false;
  if (LINK_ID && !canEdit()) {
    const st = /^[a-z0-9]{8,40}$/i.test(LINK_ID) ? await Store.get("students/" + LINK_ID) : null;
    if (st) { st.id = LINK_ID; S.students = [st]; S.cur = st; S.studentView = true; S.focus = lsGet("pref:focus") !== false; }
    else { S.cur = null; toast("수강생 정보를 찾을 수 없어요. 링크를 다시 확인해 주세요"); }
    return;
  }
  S.showAll = lsGet("pref:showAll") === true;
  S.cur = null;
  pickVisible(LINK_ID || lsGet("pref:student"));
  if (LINK_ID && !S.cur && Store.admin) { const st = S.students.find(s => s.id === LINK_ID); if (st) { S.showAll = true; S.cur = st; } }
}
async function onAuthChange() {
  S.stack = []; S.page = { name: "home" }; S.mode = "view"; S.curr = {}; S.mentor = {}; S.mentorEdit = false; S.tpls = null;
  $("#app").innerHTML = `<div class="loading">불러오는 중…</div>`;
  await loadAll();
  render();
  if (Store.user && Store.staff) toast("직원으로 로그인했어요. 수정할 수 있습니다");
}
(async function start() {
  await Store.init();
  await loadAll();
  setSave(Store.local ? "local" : "idle", Store.local && !Store.failed ? "이 브라우저에만 저장됨" : "");
  render();
})();
